# Mẫu cấu hình: thay các giá trị <...> theo Console đích trước khi Kiểm tra.
# Nhập Type trước Definition. Không ghi password, token hoặc kubeconfig vào YAML.
# Thay domain/Gateway/listener mẫu theo hạ tầng có sẵn; không tạo Gateway.
key: existing-public-gateway
name: Gateway Traefik có sẵn
resourceType: k8s-gateway
driverType: echo
driverInputs:
  values:
    variables:
      gateway:
        cluster: ${resources['k8s-cluster.default#environments.@app.@env'].outputs.cluster}
        rootDomain: apps.company.example
        scheme: https
        gatewayName: public
        gatewayNamespace: gateway-system
        gatewaySectionName: websecure
criteria:
  - class: default
provision: {}
