# Mẫu cấu hình: thay các giá trị <...> theo Console đích trước khi Kiểm tra.
# Nhập Type trước Definition. Không ghi password, token hoặc kubeconfig vào YAML.
# tags/instance identity do executor cấp; Definition không tự chọn cluster lần nữa.
key: default-storage
name: PVC trong namespace
resourceType: persistent-storage
driverType: terraform
driverInputs:
  values:
    source:
      url: https://github.com/pr3s3nt/orchestrator-workload-templates
      ref: b8e98a7f2d2239ab99de52b5dda7321653119dec
      path: terraform/persistent-storage
    variables:
      namespace: ${resources['k8s-namespace.default#environments.@app.@env'].outputs.name}
      storage: 2Gi
      storage_class: ""
      access_mode: ReadWriteOnce
    input_mapping:
      storage:
        param: storage
    output_mapping:
      claimName: claimName
      namespace: namespace
    provider_bindings:
      kubernetes:
        target: resource
        resource_ref: k8s-namespace.default#environments.@app.@env
criteria:
  - class: default
provision: {}
