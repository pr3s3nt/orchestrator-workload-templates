# Mẫu cấu hình: thay các giá trị <...> theo Console đích trước khi Kiểm tra.
# Nhập Type trước Definition. Không ghi password, token hoặc kubeconfig vào YAML.
# image phải có dạng repository[:tag]@sha256:64-hex; password/master_password do executor cấp.
key: default-mysql
name: MySQL trong namespace
resourceType: mysql
driverType: terraform
driverInputs:
  values:
    source:
      url: https://github.com/pr3s3nt/orchestrator-workload-templates
      ref: b8e98a7f2d2239ab99de52b5dda7321653119dec
      path: terraform/mysql
    variables:
      namespace: ${resources['k8s-namespace.default#environments.@app.@env'].outputs.name}
      image: <image MySQL tương thích đã pin bằng digest>
      username: app
      storage: 10Gi
      storage_class: ""
      image_pull_secret_name: ""
    input_mapping:
      database:
        param: database
      username:
        param: username
      storage:
        param: storage
    output_mapping:
      host: host
      port: port
      database: database
      username: username
      password: password
      claimName: claimName
      namespace: namespace
      uri: uri
      jdbcUrl: jdbcUrl
    provider_bindings:
      kubernetes:
        target: resource
        resource_ref: k8s-namespace.default#environments.@app.@env
criteria:
  - class: default
provision: {}
