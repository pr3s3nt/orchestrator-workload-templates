# Mẫu cấu hình: thay các giá trị <...> theo Console đích trước khi Kiểm tra.
# Nhập Type trước Definition. Không ghi password, token hoặc kubeconfig vào YAML.
# Giữ key staging-mongodb cũ; phạm vi thực tế do criteria quyết định, không phải tên key.
# Thay image digest thật. Password/master_password/tags do executor cấp.
key: staging-mongodb
name: MongoDB trong namespace
resourceType: mongodb
driverType: terraform
driverInputs:
  values:
    source:
      url: https://github.com/pr3s3nt/orchestrator-workload-templates
      ref: b8e98a7f2d2239ab99de52b5dda7321653119dec
      path: terraform/mongodb
    variables:
      image: <image MongoDB đã pin bằng digest>
      namespace: ${resources['k8s-namespace.default#environments.@app.@env'].outputs.name}
      username: app
      storage: 10Gi
      storage_class: ""
      image_pull_secret_name: ""
      root_username: admin
    input_mapping:
      database:
        param: database
      username:
        param: username
      storage:
        param: storage
    output_mapping:
      host: host
      port: port
      database: database
      username: username
      password: password
      connection: connection
    provider_bindings:
      kubernetes:
        target: resource
        resource_ref: k8s-namespace.default#environments.@app.@env
criteria:
  - class: default
provision: {}
