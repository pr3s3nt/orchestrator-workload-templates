# Nhập sau mongodb-type.yaml: Console > Cấu hình tài nguyên > Nhập YAML/JSON.
# Điền image MongoDB đã pin digest và chọn cluster/namespace/criteria phù hợp.
# Bấm Kiểm tra cấu hình, xem commit đã xác minh, rồi Đăng ký.
# Hệ thống tự tạo IDs/hash; không cần lấy source pin từ DevTools.
# Cần Console hỗ trợ Git source url/ref/path (issue pr3s3nt/poc#79).
# Password/master_password do executor sinh, không điền vào file.
key: staging-mongodb
name: Staging MongoDB
resourceType: mongodb
driverType: terraform
driverInputs:
  values:
    source:
      url: https://github.com/pr3s3nt/orchestrator-workload-templates
      ref: main
      path: terraform/mongodb
    variables:
      # Docker Official Image MongoDB hoặc image nội bộ tương thích có mongosh.
      # Dùng digest thật đã duyệt, dạng registry/repository@sha256:64-hex.
      image: "<image MongoDB đã pin bằng digest>"
      namespace: "${resources['k8s-namespace.default#environments.@app.@env'].outputs.name}"
      username: app
      storage: 10Gi
      # Rỗng: dùng StorageClass mặc định của cluster; sửa nếu cần class cụ thể.
      storage_class: ""
      # Rỗng: không dùng imagePullSecret; nếu cần, điền tên Secret đã có ở namespace.
      image_pull_secret_name: ""
      root_username: admin
    # Tên module variable -> input của Type. Workload param ghi đè fallback.
    input_mapping:
      database: {param: database}
      username: {param: username}
      storage: {param: storage}
    # Tên module output -> output của Type. Không công bố claimName/namespace.
    output_mapping:
      host: host
      port: port
      database: database
      username: username
      password: password
      connection: connection
    provider_bindings:
      kubernetes:
        target: resource
        # Thay bootstrap-dev bằng class cluster thực tế nếu khác.
        resource_ref: "k8s-cluster.bootstrap-dev#environments.@app.@env"
# staging/in-cluster là lựa chọn của mẫu; sửa theo môi trường cần sử dụng.
# Cần Definition cluster class bootstrap-dev và namespace class default match
# được cùng ngữ cảnh. Giữ nguyên @app/@env để platform resolve dependencies.
criteria:
  - env_type: staging
    class: in-cluster
provision: {}
